name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist -- --publish never
      - name: Prepare Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-windows | Out-Null
          Copy-Item release/*.exe release-windows/
          $hashes = Get-ChildItem release-windows/*.exe | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release-windows/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odins-glasses-windows
          path: release-windows/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run mobile:sync
      - name: Restore signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/odins-glasses-release.jks"
      - name: Build signed Android APK
        working-directory: android
        env:
          ODINS_KEYSTORE_PATH: ${{ runner.temp }}/odins-glasses-release.jks
          ODINS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ODINS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ODINS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify and prepare Android release files
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee ANDROID-SIGNING-CERTIFICATE.txt
          grep -qi "02417474388d44a79b20d0f81d1da88123995636cf6f750035eecc88abc74772" ANDROID-SIGNING-CERTIFICATE.txt
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)"
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/Odins-Glasses-Android-$VERSION_NAME.apk"
          cp ANDROID-SIGNING-CERTIFICATE.txt release-android/
          cd release-android
          sha256sum "Odins-Glasses-Android-$VERSION_NAME.apk" > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odins-glasses-android
          path: release-android/*
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: odins-glasses-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Odin's Glasses $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
